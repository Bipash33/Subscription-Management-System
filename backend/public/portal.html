<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal | SubFlow</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/portal.css">
</head>
<body>

<header>

    <div class="logo">
        <h2>SubFlow</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="plans.html">Plans</a>
        <a href="portal.html">Portal</a>
        <a href="billing.html">Billing</a>
        <a href="admin.html">Admin</a>
    </nav>

</header>

<section class="portal">

    <h1>Customer Portal</h1>

    <div class="portal-card">

        <h2>Your Subscription</h2>

        <p><strong>Current Plan:</strong> <span id="planName">No Plan</span></p>

        <p><strong>Status:</strong> <span id="status">Inactive</span></p>

        <p><strong>Renewal Date:</strong> <span id="renewDate">--</span></p>

        <div class="buttons">

            <button id="upgradeBtn">Upgrade</button>

            <button id="downgradeBtn">Downgrade</button>

            <button id="cancelBtn">Cancel Subscription</button>

        </div>

    </div>

</section>

<script src="js/portal.js"></script>

</body>
</html>
